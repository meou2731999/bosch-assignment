<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64756c"/></marker></defs><rect width="1000" height="610" fill="#f8faf5"/><g font-family="Arial,sans-serif" fill="#173f35"><text x="45" y="55" font-size="28" font-weight="bold">Request Desk: prototype boundaries</text><text x="45" y="85" font-size="14" fill="#64756c">JSON-driven forms inside React, with application-owned data and policy</text><rect x="45" y="135" width="405" height="105" rx="10" fill="#edf3e7" stroke="#d9e2d8"/><text x="65" y="175" font-size="21" font-weight="bold">React product experience</text><text x="65" y="207" font-size="14" fill="#64756c">Identity, requests, locale, network state</text><rect x="550" y="135" width="405" height="105" rx="10" fill="#edf3e7" stroke="#d9e2d8"/><text x="570" y="175" font-size="21" font-weight="bold">Local product API</text><text x="570" y="207" font-size="14" fill="#64756c">Access, validation, revisions and audit</text><rect x="45" y="300" width="405" height="105" rx="10" fill="#edf3e7" stroke="#d9e2d8"/><text x="65" y="340" font-size="21" font-weight="bold">DynamicForm / FormHandle</text><text x="65" y="372" font-size="14" fill="#64756c">Form.io basic + React structured fields</text><rect x="550" y="300" width="405" height="105" rx="10" fill="#edf3e7" stroke="#d9e2d8"/><text x="570" y="340" font-size="21" font-weight="bold">JSON definitions + local store</text><text x="570" y="372" font-size="14" fill="#64756c">Published forms, requests, snapshots and audit</text><g stroke="#64756c" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M450,185 H545"/><path d="M247,240 V293"/><path d="M752,240 V293"/></g><text x="45" y="475" font-size="17" font-weight="bold">Customer integration - proposed, not implemented</text><text x="45" y="507" font-size="15">Existing product session + scoped API 